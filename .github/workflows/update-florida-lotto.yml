name: Update Florida Lotto results

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/update-florida-lotto.yml"
      - "tools/update_florida_results.py"

permissions:
  contents: write

concurrency:
  group: update-florida-lotto
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download, cross-check, and publish results
        run: python tools/update_florida_results.py data/florida_lotto_results.json

      - name: Commit updated results
        shell: powershell
        run: |
          if (-not (git status --porcelain -- data/florida_lotto_results.json)) {
            Write-Host "Florida Lotto results are already current."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/florida_lotto_results.json
          git commit -m "Update Florida Lotto results"
          git push
